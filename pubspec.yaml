name: mirqat
description: "Offline Quran memorization (hifz) through talqeen-style audio repetition."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.1.0+5

environment:
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  go_router: ^18.0.1
  flutter_screenutil: ^5.9.3
  easy_localization: ^3.0.8
  just_audio: ^0.10.6
  # APPROVED 2026-09-28 (CLAUDE.md A.4, blocker B2 of the Windows build):
  # just_audio's federated Windows implementation. just_audio itself has none,
  # so on Windows no recitation plays without it. Registers itself; nothing
  # under lib/ imports it.
  just_audio_windows: ^0.2.3
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  dartz: ^0.10.1
  equatable: ^2.1.0
  sqflite: ^2.3.0
  # PROPOSED EXCEPTION to the no-new-packages rule (CLAUDE.md A.4): not new
  # code — sqflite's own pure-Dart API, already in the build through sqflite.
  # Named directly so the catalog loader can use `Database` without importing
  # Flutter, which keeps `dart run tools/verify_assets.dart` working.
  sqflite_common: ^2.5.13
  # APPROVED 2026-09-28 (CLAUDE.md A.4, blocker B1 of the Windows build),
  # promoted from test-only. `sqflite` has no Windows implementation, so on
  # Windows quran.db is opened through this in-process engine instead — see
  # AppBootstrap. Its `sqlite3` dependency bundles SQLite itself through build
  # hooks, so no DLL ships by hand. Tests go on using it as before.
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.0
  path: ^1.9.0
  background_downloader: ^8.5.0
  archive: ^4.0.7
  crypto: ^3.0.3
  http: ^1.2.0
  audio_service: ^0.18.19
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # PROPOSED EXCEPTION to the no-new-packages rule (CLAUDE.md A.4).
  # Build-time only: it generates the launcher rasters and contributes nothing
  # to the runtime or to the APK. The alternative is hand-cutting fifteen sizes
  # across two platforms and re-cutting them on every icon revision.
  #   dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

  # PROPOSED EXCEPTION to the no-new-packages rule (CLAUDE.md A.4), on the
  # same grounds as flutter_launcher_icons above: build-time only. It writes
  # the platform splash resources (Android drawables + styles, the iOS
  # storyboard) and contributes nothing to the runtime or to the APK.
  #   dart run flutter_native_splash:create
  flutter_native_splash: ^2.4.6


flutter_launcher_icons:
  android: true
  ios: true
  # Generator inputs live in brand/, deliberately OUTSIDE assets/: they are
  # read off disk at build time and emitted as platform rasters, so bundling
  # them would add four 1024px PNGs to every APK for nothing. Only the three
  # runtime splash plates sit under assets/brand/.
  image_path: "brand/icon_1024.png"
  adaptive_icon_background: "brand/icon_background_1024.png"
  adaptive_icon_foreground: "brand/icon_foreground_1024.png"
  adaptive_icon_monochrome: "brand/icon_monochrome_1024.png"
  # NOT in the spec'd block, and kept on purpose after re-measuring the NEW
  # foreground (the previous comment here described the retired medallion and
  # its numbers no longer applied). The mihrab arch's opaque content measures
  # 304 x 388 px on the 1024 canvas — 29.7% x 37.9%, centred, with 0.00% of it
  # outside Android's 66dp safe circle. It is already conservatively inset, so
  # the tool's default 16% inset would shrink it to 20.2% of the canvas, about
  # 30% of the visible mask, and leave the mark swimming. Re-measure before
  # changing this; do not adjust it by eye.
  adaptive_icon_foreground_inset: 0
  # App Store Connect rejects an iOS icon carrying an alpha channel.
  remove_alpha_ios: true
  # Read from android/app/build.gradle.kts -> flutter.minSdkVersion, which is
  # 24 in this Flutter SDK (FlutterExtension.kt:26). Confirmed against the
  # built APK's badging. Not assumed.
  min_sdk_android: 24

flutter_native_splash:
  # This exists only to stop a white flash before Flutter's first frame, so it
  # matches frame 0 of the Dart animation: the dark cave interior. Anything
  # prettier here would be a second, competing splash.
  color: "#1C1209"
  color_dark: "#1C1209"
  background_image: "assets/brand/splash_first_frame.png"
  background_image_dark: "assets/brand/splash_first_frame.png"
  # No `image:` / `image_dark:`. The previous static splash centred a logo over
  # a colour; the animation replaces it, and a logo here would appear for an
  # instant and then be replaced by a different composition.
  fullscreen: false
  # This is an offline Android/iOS app; web/ is vestigial Flutter scaffolding.
  # Left on, the generator rewrites web/index.html and web/manifest.json, which
  # is churn in files the product never ships.
  web: false
  # PLATFORM CONSTRAINT, not a choice: on Android 12+ the system splash always
  # shows the app icon on a solid colour and ignores background_image. The
  # sequence there is icon splash -> animated splash -> home. Matching this
  # background to the brand green keeps the handover calm instead of cutting
  # from vellum to a dark cave.
  android_12:
    color: "#06301F"
    color_dark: "#06301F"
    image: "brand/icon_foreground_1024.png"
    icon_background_color: "#06301F"
    icon_background_color_dark: "#06301F"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # Flutter bundles only the DIRECT children of a declared directory, so every
  # nested folder needs its own line. A new reciter adds one line here.
  assets:
    - assets/translations/
    # The two animated-splash plates plus the native splash's first frame.
    # This directory holds ONLY files the app loads at runtime — the icon
    # sources and the editing masters live in brand/, outside assets/, so a
    # directory declaration cannot sweep them into the bundle.
    - assets/brand/
    # No reciter portraits ship: a reciter is added through the manifest, and
    # a reciter the app has never heard of has no bundled photo to fall back
    # on. Portraits come from the CDN and are cached on the device the first
    # time they are shown (ReciterImageCache).
    - assets/data/
    - assets/data/quran.db
    - assets/audio/
    # The reciter's own directory, holding the two preambles that serve every
    # surah. Without this line bismillah.mp3 and istiadhah.mp3 exist on disk
    # but never reach the bundle.
    #
    # No surah audio ships any more: 11 MB of per-ayah clips and their timings
    # moved to the CDN, where the app streams them or downloads them as packs.
    # What stays is 137 KB of preambles, so a session can still open with the
    # isti'adhah and the basmala before a single byte is fetched.
    - assets/audio/ahmed_khalil_shaheen/

  fonts:
    # BLOCKED — uncomment the moment the four IBM Plex Sans Arabic TTFs land in
    # assets/fonts/. They are not in the repo (see the Phase 0 report), and
    # Flutter fails the build on a declared font asset that does not exist, so
    # the block stays commented rather than breaking `flutter build` for
    # everyone. Until then AppTextStyles.uiFontFamily resolves to the platform
    # default: the app runs and looks plausible, but it is not yet in the
    # brand's typeface.
    # - family: IqraWartaqUI
    #   fonts:
    #     - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
    #       weight: 400
    #     - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
    #       weight: 500
    #     - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
    #       weight: 600
    #     - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
    #       weight: 700

    # UthmanicHafs V22 ships with the QUL script export that assets/data/quran.db
    # is built from, so it is that text's own font — a text stays with its own
    # font. Copied byte-for-byte from data/sources/; never modified.
    - family: QuranUthmani
      fonts:
        - asset: assets/fonts/UthmanicHafs_V22.ttf
