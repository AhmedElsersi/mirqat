<!-- title: اقرأ من حفظك -->
<div class="mushaf">
  <div class="frame">
    <div class="frame-top"><span>سورة {{surah 67}}</span><span>الجزء ٢٩</span></div>
    <div class="page">
{{page 562 veil=67:3}}
    </div>
    <div class="frame-foot">٥٦٢</div>
  </div>
</div>

<!-- A recall round: the ayah's place is shown, its ink withheld, and the bar
     says what is asked — no score, no timer pressure, just the silence. -->
<div class="player">
  <div class="row">
    <span class="ico" style="background:var(--gold-soft)"><i data-lucide="mic"></i></span>
    <div class="grow">
      <p class="h3">اقرأ من حفظك: الآية {{n 3}}</p>
      <p class="muted tiny">يصمت التطبيق بطولها، ثم تُسمَع مرة للتثبيت</p>
    </div>
  </div>
  <div class="bar" style="margin-top:14px"><i style="width:55%"></i></div>
  <div class="controls">
    <button class="icon-btn" aria-label="إعدادات الجلسة"><i data-lucide="sliders-horizontal"></i></button>
    <button class="chip"><i data-lucide="eye"></i> اكشفها</button>
    <button class="big" aria-label="إيقاف مؤقت"><i data-lucide="pause"></i></button>
    <button class="chip"><i data-lucide="flag"></i> أتعثّر هنا</button>
    <button class="icon-btn" aria-label="إنهاء"><i data-lucide="square"></i></button>
  </div>
</div>
