<!-- title: القراءة والجلسة -->
<div class="mushaf">
  <div class="frame">
    <div class="frame-top"><span>سورة {{surah 3}}</span><span>الجزء ٣ · الحزب ٥</span></div>
    <div class="page">
{{page 50 hl=3:4}}
    </div>
    <div class="frame-foot">٥٠</div>
  </div>
</div>

<!-- The session bar: what is sounding, where in the ladder, and the few controls. -->
<div class="player">
  <div class="row">
    <span class="avatar">أ</span>
    <div class="grow">
      <p class="h3">{{surah 3}} · الآية {{n 4}}</p>
      <p class="muted tiny">التكرار ٢ من ٣ · الدرجة ٤ من ٩</p>
    </div>
    <span class="chip" style="height:30px;padding:0 10px"><i data-lucide="repeat-1"></i> ثلاثًا أخرى</span>
  </div>
  <div class="steps" style="margin-top:12px" aria-label="الدرجة ٤ من ٩">
    <i class="done"></i><i class="done"></i><i class="done"></i><i class="now"></i><i></i><i></i><i></i><i></i><i></i>
  </div>
  <div class="controls">
    <button class="icon-btn" aria-label="إعدادات الجلسة"><i data-lucide="sliders-horizontal"></i></button>
    <button class="icon-btn" aria-label="الخطوة السابقة"><i data-lucide="skip-forward"></i></button>
    <button class="big" aria-label="إيقاف مؤقت"><i data-lucide="pause"></i></button>
    <button class="icon-btn" aria-label="الخطوة التالية"><i data-lucide="skip-back"></i></button>
    <button class="icon-btn" aria-label="إنهاء"><i data-lucide="square"></i></button>
  </div>
</div>
