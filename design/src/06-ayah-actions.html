<!-- title: قائمة الآية -->
<div class="mushaf" aria-hidden="true">
  <div class="frame"><div class="page">{{page 50 hl=3:7}}</div></div>
</div>
<div class="scrim"></div>

<!-- Eight actions were one long list. The six done often are a grid a thumb
     reaches; the range and the similar ayahs, read rather than tapped, sit below. -->
<section class="sheet">
  <div class="grabber"></div>
  <div class="row">
    <span class="num"><span>٧</span></span>
    <div class="grow">
      <p class="h2">{{surah 3}} · الآية {{n 7}}</p>
      <p class="muted tiny">مدنية · {{ayahs 3}} آية · الأجزاء ٣–٤ · صفحة ٥٠</p>
    </div>
  </div>

  <div class="qgrid" style="margin-top:16px">
    <button class="qa"><i data-lucide="headphones"></i>استمع إلى آخر السورة</button>
    <button class="qa"><i data-lucide="repeat-1"></i>احفظها وحدها</button>
    <button class="qa"><i data-lucide="bookmark-check" style="color:var(--gold)"></i>انتهيت هنا</button>
    <button class="qa"><i data-lucide="flag"></i>أتعثّر هنا</button>
    <button class="qa"><i data-lucide="image"></i>شارك الآية</button>
    <button class="qa"><i data-lucide="book-open"></i>شارك الصفحة</button>
  </div>

  <div class="list" style="margin-top:14px">
    <div class="li"><span class="ico"><i data-lucide="git-compare-arrows"></i></span>
      <div class="grow"><p class="h3">آيات متشابهة</p><p class="muted tiny">تشبه: {{surah 3}} ١٣٨ · {{surah 2}} ٢٨٥ · و٢ غيرها</p></div>
      <span class="tag">٤</span></div>
    <div class="li"><span class="ico"><i data-lucide="brackets"></i></span>
      <div class="grow"><p class="h3">النطاق</p><p class="muted tiny">اجعلها البداية أو النهاية</p></div>
      <div class="row" style="gap:6px"><span class="chip">بداية</span><span class="chip">نهاية</span></div></div>
  </div>
</section>
