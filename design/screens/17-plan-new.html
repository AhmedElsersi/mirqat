<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خطة جديدة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../styles/app.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="device">
<div class="status" aria-hidden="true"><span>٩:٤١</span>
<span class="status-icons"><i data-lucide="signal"></i><i data-lucide="wifi"></i><i data-lucide="battery-full"></i></span></div>
<div class="scroll" style="padding-bottom:30px">
  <header class="topbar">
    <button class="icon-btn" aria-label="رجوع"><i data-lucide="arrow-right"></i></button>
    <h1 class="h2 grow">خطة جديدة</h1>
  </header>

  <p class="muted small" style="margin:0 4px 14px">اختر ما تحفظه وفي كم يومًا، فيُقسَّم إلى مقاطع متقاربة الطول دون أن تُجزَّأ آية.</p>

  <!-- The range as two rows, as the session sheet asks for it. -->
  <div class="field-label">ما تحفظه</div>
  <div class="list">
    <div class="li"><span class="ico"><i data-lucide="arrow-down-to-line"></i></span>
      <div class="grow"><p class="muted tiny">من</p><p class="h3">سورة النبإ، الآية ١</p></div>
      <i data-lucide="chevron-left" class="chev"></i></div>
    <div class="li"><span class="ico"><i data-lucide="arrow-up-to-line"></i></span>
      <div class="grow"><p class="muted tiny">إلى</p><p class="h3">سورة الناس، الآية ٦</p></div>
      <i data-lucide="chevron-left" class="chev"></i></div>
  </div>

  <div class="field-label">عدد الأيام</div>
  <div class="stepper">
    <button aria-label="زِد"><i data-lucide="plus"></i></button><b>٦٠</b>
    <button aria-label="أنقِص"><i data-lucide="minus"></i></button>
  </div>
  <div class="chips" style="margin-top:10px">
    <span class="chip">٧ أيام</span><span class="chip">٣٠ يومًا</span>
    <span class="chip on">٦٠ يومًا</span><span class="chip">٩٠ يومًا</span>
  </div>

  <!-- What the choice amounts to, in one line, before the button. -->
  <section class="card" style="margin-top:18px;text-align:center">
    <p class="h1" style="font-size:22px">٥٦٤ آية، نحو ١٠ في اليوم</p>
    <p class="muted tiny" style="margin-top:4px">يظهر مقطع اليوم في صفحة «اليوم».</p>
  </section>

  <button class="btn btn-primary btn-block" style="margin-top:16px"><i data-lucide="flag-triangle-right"></i> ابدأ الخطة</button>
</div>

</div>
<script src="../styles/screen.js"></script>
</body>
</html>
