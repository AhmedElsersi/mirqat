<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صيانة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../styles/app.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="device">
<div class="status" aria-hidden="true"><span>٩:٤١</span>
<span class="status-icons"><i data-lucide="signal"></i><i data-lucide="wifi"></i><i data-lucide="battery-full"></i></span></div>
<!-- The closed sign, and the page a required update shows: one thing on the
     screen, one button, and when to expect the app back. -->
<div class="centre">
  <div>
    <span class="seal"><i data-lucide="wrench"></i></span>
    <h1 class="h1">التطبيق في صيانة</h1>
    <p class="muted small" style="margin-top:10px;max-width:30ch;margin-inline:auto">نُجري صيانةً قصيرة. عُد بعد قليل، ونعتذر عن الإزعاج.</p>
    <p class="tag" style="margin-top:16px">العودة المتوقّعة: ١٠:٣٠ م</p>
    <div style="margin-top:26px"><button class="btn btn-primary"><i data-lucide="refresh-cw"></i> إعادة المحاولة</button></div>
    <p class="note" style="margin-top:22px;justify-content:center"><i data-lucide="info"></i>
      صفحة التحديث الإلزامي هي هذه الصفحة نفسها، بزرّ المتجر بدلًا من إعادة المحاولة.</p>
  </div>
</div>

</div>
<script src="../styles/screen.js"></script>
</body>
</html>
