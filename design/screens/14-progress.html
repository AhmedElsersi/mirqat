<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المتابعة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../styles/app.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="device">
<div class="status" aria-hidden="true"><span>٩:٤١</span>
<span class="status-icons"><i data-lucide="signal"></i><i data-lucide="wifi"></i><i data-lucide="battery-full"></i></span></div>
<div class="scroll" style="padding-bottom:30px">
  <header class="topbar">
    <button class="icon-btn" aria-label="رجوع"><i data-lucide="arrow-right"></i></button>
    <div class="grow"><p class="eyebrow">المتابعة</p><p class="h3">سورة النبإ</p></div>
  </header>

  <!-- Where the surah stands, once, at the top — instead of a status word
       repeated on every ayah. -->
  <section class="card">
    <div class="row">
      <span class="ring" style="--p:60;width:52px;height:52px"><span>٦٠٪</span></span>
      <div class="grow"><p class="h1" style="font-size:22px">٢٤ من ٤٠ آية</p>
        <p class="muted tiny">محفوظة، و٦ قيد الحفظ</p></div>
      <span class="ladder" aria-hidden="true"><i class="done"></i><i class="done"></i><i class="now"></i><i></i></span>
    </div>
  </section>

  <div class="legend" style="margin:16px 4px 10px">
    <span><i class="full"></i> محفوظة</span>
    <span><i class="half"></i> قيد الحفظ</span>
    <span><i></i> لم يبدأ</span>
    <span><i style="border:0;background:none;position:relative;top:4px;width:4px;height:4px;border-radius:50%;background:var(--text-2)"></i> كرّرتها في جلسة</span>
  </div>

  <!-- One cell per ayah: its number, and its state as a tint. The colour says
       what the word used to say, and forty ayahs now fit on one screen. -->
  <div class="cells"><b class="full">١</b><b class="full">٢</b><b class="full">٣</b><b class="full">٤</b><b class="full rep">٥</b><b class="full">٦</b><b class="full">٧</b><b class="full">٨</b><b class="full rep">٩</b><b class="full">١٠</b><b class="full">١١</b><b class="full">١٢</b><b class="full">١٣</b><b class="full rep">١٤</b><b class="full">١٥</b><b class="full">١٦</b><b class="full">١٧</b><b class="full">١٨</b><b class="half rep">١٩</b><b class="half rep">٢٠</b><b class="full">٢١</b><b class="full">٢٢</b><b class="full">٢٣</b><b class="full">٢٤</b><b class="half">٢٥</b><b class="half">٢٦</b><b class="half">٢٧</b><b class="half">٢٨</b><b class="">٢٩</b><b class="">٣٠</b><b class="">٣١</b><b class="">٣٢</b><b class="">٣٣</b><b class="">٣٤</b><b class="">٣٥</b><b class="">٣٦</b><b class="">٣٧</b><b class="">٣٨</b><b class="">٣٩</b><b class="full rep">٤٠</b></div>

  <p class="note" style="margin-top:14px"><i data-lucide="hand"></i> المس آية لتعليمها محفوظة، والمسها مرة أخرى لإلغاء التعليم.</p>
</div>

</div>
<script src="../styles/screen.js"></script>
</body>
</html>
