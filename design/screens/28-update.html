<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحديث متوفّر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../styles/app.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="device">
<div class="status" aria-hidden="true"><span>٩:٤١</span>
<span class="status-icons"><i data-lucide="signal"></i><i data-lucide="wifi"></i><i data-lucide="battery-full"></i></span></div>
<div class="scroll" aria-hidden="true">
  <header class="topbar"><h1 class="h1 grow">اليوم</h1></header>
  <div class="hero" style="height:190px"></div>
  <div class="pair"><div class="card" style="height:96px"></div><div class="card" style="height:96px"></div></div>
  <div class="card" style="height:84px;margin-top:12px"></div>
  <div class="card" style="height:84px"></div>
  <div class="card" style="height:84px"></div>
</div>
<div class="scrim"></div>

<!-- An optional update speaks once, over the app, and takes «لاحقًا» for an
     answer — it is never a page that has to be got past. -->
<section class="dialog">
  <span class="ladder" style="margin:0 auto 16px" aria-hidden="true"><i class="done"></i><i class="done"></i><i class="now"></i><i></i></span>
  <h2 class="h2">يتوفّر إصدار أحدث</h2>
  <p class="muted small" style="margin-top:8px">حدّث التطبيق لتحصل على آخر التحسينات. يمكنك المتابعة الآن والتحديث لاحقًا.</p>

  <div class="card" style="margin-top:16px;text-align:start;background:var(--surface-2);border-color:transparent">
    <p class="eyebrow">الجديد في هذا الإصدار</p>
    <p class="small" style="margin-top:4px">علامة القراءة على الصفحة، وتمرين المتشابهات.</p>
  </div>

  <div class="row" style="margin-top:18px">
    <button class="btn btn-ghost grow">لاحقًا</button>
    <button class="btn btn-primary grow"><i data-lucide="download"></i> تحديث</button>
  </div>
</section>

</div>
<script src="../styles/screen.js"></script>
</body>
</html>
