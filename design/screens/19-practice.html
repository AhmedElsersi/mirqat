<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سجلّ المواظبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../styles/app.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="device">
<div class="status" aria-hidden="true"><span>٩:٤١</span>
<span class="status-icons"><i data-lucide="signal"></i><i data-lucide="wifi"></i><i data-lucide="battery-full"></i></span></div>
<div class="scroll" style="padding-bottom:30px">
  <header class="topbar">
    <button class="icon-btn" aria-label="رجوع"><i data-lucide="arrow-right"></i></button>
    <h1 class="h2 grow">سجلّ المواظبة</h1>
  </header>

  <!-- Four numbers, said once and plainly. No streak to keep alive, no badge,
       and nothing at all about a day that passed (docs/BRAND_GUIDE.md §6). -->
  <section class="card">
    <div class="row">
      <div class="grow"><p class="eyebrow">أيام المواظبة</p><p class="h1" style="font-size:34px">٤٦</p>
        <p class="muted tiny">يومًا قرأت فيه أو استمعت</p></div>
      <span class="ladder" aria-hidden="true"><i class="done"></i><i class="done"></i><i class="done"></i><i class="now"></i></span>
    </div>
  </section>

  <div class="pair">
    <div class="card stat"><p class="n">٩٣٠</p><p class="muted tiny">دقائق الاستماع</p></div>
    <div class="card stat"><p class="n">٢٤١٠</p><p class="muted tiny">مرات التلاوة المسموعة</p></div>
  </div>
  <div class="pair">
    <div class="card stat"><p class="n">٤١٢</p><p class="muted tiny">آيات علّمتها محفوظة</p></div>
    <div class="card stat"><p class="n">٢١</p><p class="muted tiny">مقاطع في جدول المراجعة</p></div>
  </div>

  <p class="note" style="margin-top:18px"><i data-lucide="smartphone"></i>
    يُحسب كل شيء على هذا الجهاز وحده، ولا يُرسل إلى أي مكان.</p>
</div>

</div>
<script src="../styles/screen.js"></script>
</body>
</html>
