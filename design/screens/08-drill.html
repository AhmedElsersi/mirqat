<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تمرين المتشابهات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../styles/app.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="device">
<div class="status" aria-hidden="true"><span>٩:٤١</span>
<span class="status-icons"><i data-lucide="signal"></i><i data-lucide="wifi"></i><i data-lucide="battery-full"></i></span></div>
<div class="scroll" style="padding-bottom:30px">
  <header class="topbar">
    <button class="icon-btn" aria-label="رجوع"><i data-lucide="arrow-right"></i></button>
    <div class="grow"><p class="eyebrow">تمرين المتشابهات</p><p class="h3">الجولة ٢ من ٣</p></div>
    <div class="steps" style="width:90px"><i class="done"></i><i class="now"></i><i></i></div>
  </header>

  <!-- The ayah as far as the shared phrase; the rest is withheld, in place. -->
  <section class="card" style="padding:22px 18px">
    <p class="eyebrow" style="margin-bottom:10px">العبارة المشتركة</p>
    <p class="quran" style="font-size:24px;text-align:center">
      <span style="background:var(--tint-hl);box-shadow:6px 0 0 var(--tint-hl),-6px 0 0 var(--tint-hl)">وَقَالُواْ ٱتَّخَذَ ٱلرَّحۡمَٰنُ وَلَدٗاۗ</span>
      <span style="color:transparent;background:var(--tint-veil);box-shadow:6px 0 0 var(--tint-veil),-6px 0 0 var(--tint-veil)">سُبۡحَٰنَهُۥۚ بَلۡ عِبَادٞ مُّكۡرَمُونَ</span>
    </p>
  </section>

  <h2 class="h2" style="margin:24px 4px 12px">أيّ آية هذه؟</h2>
  <div class="stack">
    <button class="card row btn-block" style="text-align:start"><span class="num"><span>٢</span></span><div class="grow"><p class="h3">البقرة، الآية ١١٦</p></div><i data-lucide="circle" class="muted"></i></button>
    <button class="card row btn-block" style="text-align:start;border-color:var(--primary);border-width:2px"><span class="num"><span>٢١</span></span><div class="grow"><p class="h3">الأنبياء، الآية ٢٦</p></div><i data-lucide="circle-dot"></i></button>
    <button class="card row btn-block" style="text-align:start"><span class="num"><span>١٩</span></span><div class="grow"><p class="h3">مريم، الآية ٨٨</p></div><i data-lucide="circle" class="muted"></i></button>
  </div>

  <p class="muted small" style="text-align:center;margin:22px 0 10px">ثم أكمِلها من حفظك، واكشف الباقي.</p>
  <button class="btn btn-primary btn-block"><i data-lucide="eye"></i> اكشف الباقي</button>
</div>

</div>
<script src="../styles/screen.js"></script>
</body>
</html>
