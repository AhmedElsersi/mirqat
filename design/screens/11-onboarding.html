<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المقدّمة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../styles/app.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="device">
<div class="status" aria-hidden="true"><span>٩:٤١</span>
<span class="status-icons"><i data-lucide="signal"></i><i data-lucide="wifi"></i><i data-lucide="battery-full"></i></span></div>
<div class="scroll" style="display:flex;flex-direction:column;padding-bottom:40px">
  <div class="row" style="justify-content:flex-start;padding:6px 4px"><button class="btn" style="height:40px">تخطٍّ</button></div>

  <!-- The method, drawn as the brand draws it: rungs, each overlapping the
       one below, the top one gold. No mosque, no mushaf illustration. -->
  <div style="flex:1;display:grid;place-items:center">
    <svg viewBox="0 0 220 200" width="240" aria-hidden="true">
      <!-- Climbing to the upper left: forward, for an Arabic reader. -->
      <rect x="80" y="150" width="120" height="24" rx="12" fill="var(--sabr)"/>
      <rect x="52" y="112" width="120" height="24" rx="12" fill="var(--sabr)"/>
      <rect x="24" y="74" width="120" height="24" rx="12" fill="var(--forest)"/>
      <rect x="4" y="36" width="104" height="24" rx="12" fill="var(--gold)"/>
      <text x="140" y="167" font-size="13" font-family="IBM Plex Sans Arabic" fill="#fff" text-anchor="middle">آية ١</text>
      <text x="112" y="129" font-size="13" font-family="IBM Plex Sans Arabic" fill="#fff" text-anchor="middle">١ + ٢</text>
      <text x="84" y="91" font-size="13" font-family="IBM Plex Sans Arabic" fill="#F9F4E6" text-anchor="middle">١ + ٢ + ٣</text>
      <text x="56" y="53" font-size="13" font-family="IBM Plex Sans Arabic" fill="#04241A" text-anchor="middle">آية ٤</text>
    </svg>
  </div>

  <p class="eyebrow" style="text-align:center">٢ من ٧</p>
  <h1 class="h1" style="text-align:center;margin-top:6px">احفظ كما في الحلقة</h1>
  <p class="muted" style="text-align:center;margin:10px 18px 0">تسمع الآية وتكرّرها، ثم التي تليها، ثم تصلهما معًا — درجةً درجة، حتى تثبت.</p>

  <div class="row" style="justify-content:center;gap:6px;margin:26px 0">
    <i style="width:8px;height:8px;border-radius:4px;background:var(--outline)"></i>
    <i style="width:22px;height:8px;border-radius:4px;background:var(--gold)"></i>
    <i style="width:8px;height:8px;border-radius:4px;background:var(--outline)"></i>
    <i style="width:8px;height:8px;border-radius:4px;background:var(--outline)"></i>
    <i style="width:8px;height:8px;border-radius:4px;background:var(--outline)"></i>
    <i style="width:8px;height:8px;border-radius:4px;background:var(--outline)"></i>
    <i style="width:8px;height:8px;border-radius:4px;background:var(--outline)"></i>
  </div>
  <button class="btn btn-primary btn-block">التالي</button>
</div>

</div>
<script src="../styles/screen.js"></script>
</body>
</html>
