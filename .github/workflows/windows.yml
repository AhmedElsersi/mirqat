name: Windows

# Flutter builds a Windows app only on Windows, so the .exe is made here and
# not on a developer's Mac. Run by hand from the Actions tab, or on a version
# tag beside release.yml. The result is a zip per architecture: mirqat.exe with
# the DLLs and data/ folder it needs beside it. Unzip it anywhere and run
# mirqat.exe; nothing is installed.
#
# One architecture, x64, and not by choice. Both other Windows architectures
# were tried and neither can be built, for two different reasons worth writing
# down so they are not re-attempted blind:
#
#   32-bit (x86): Flutter has no such target. `TargetPlatform` offers
#   windows-x64 and windows-arm64 and has never offered x86, so no 32-bit
#   Windows can run a Flutter app at all. Nothing in CI can change that.
#
#   arm64: Flutter publishes no Windows arm64 SDK — releases_windows.json
#   contains x64 entries only, zero arm64, at every version — and the tool
#   picks the architecture from `Abi.current()`, the ABI of the running Dart
#   process, with no flag to override it. So the x64 SDK on an arm64 runner
#   (windows-11-arm) produces an x64 build, and an arm64 SDK to produce an
#   arm64 one does not exist. Attempted on 2026-10-09 in run 37990981247: the
#   setup step refused with "Unable to determine Flutter version for channel:
#   stable version: 3.44.0 architecture: arm64". Windows on Arm machines run
#   the x64 zip under emulation, which is what they do today. The day Flutter
#   ships a Windows arm64 SDK, this becomes a two-runner matrix and the
#   publish step below already handles a second asset.
#
# The zip is always kept on the run's page. It is also published as a release
# of the public site repo — on every version tag, and on a manual run with
# "publish" ticked — because the website's Windows button downloads
# releases/latest/download/iqra-wartaq-windows-x64.zip from there. That file
# name must not change, or the button breaks.
#
# Publishing needs the SITE_RELEASE_TOKEN secret: a fine-grained token with
# Contents read/write on AhmedElsersi/iqra-wartaq and nothing else. This
# repo's own GITHUB_TOKEN cannot write to another repository.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the website's download link"
        type: boolean
        default: false

env:
  SITE_REPO: AhmedElsersi/iqra-wartaq

jobs:
  build:
    strategy:
      # A matrix of one, kept as a matrix: the architecture travels with the
      # zip's name and the output directory, so adding the second one back is
      # a line here rather than an edit of every step. One failing must not
      # take another's zip down with it.
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Keep this pin identical to ci.yml's and release.yml's.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: "stable"

      - run: flutter pub get

      # Not repeated here: analyze and test run on every push in ci.yml. This
      # job only proves the app compiles and links for Windows.
      - run: flutter build windows --release

      - name: Zip the app folder
        id: zip
        shell: pwsh
        run: |
          $full = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value
          $version = $full -replace '\+', '-'
          $name = "iqra-wartaq-windows-${{ matrix.arch }}-$version"
          # The output directory is named for the architecture the build was
          # made for, so it is read rather than assumed: a wrong guess here
          # would zip nothing and publish an empty download.
          $out = "build/windows/${{ matrix.arch }}/runner/Release"
          if (!(Test-Path $out)) {
            throw "No build output at $out. Flutter built for another architecture."
          }

          # The Visual C++ runtime the app is linked against (windows/
          # CMakeLists.txt installs it beside the exe). Without it the app
          # does not start on a machine that has never run a C++ program:
          # "MSVCP140.dll was not found", reported from a real machine on
          # 2026-10-11. A silent failure to ship it would only be found by
          # whoever downloads the zip, so it is checked here instead.
          foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            if (!(Test-Path (Join-Path $out $dll))) {
              throw "$dll is missing from the build output. The zip would not run on a machine without the Visual C++ redistributable."
            }
          }

          # How to run it, in both languages, each under its own name, at the
          # top of the zip beside mirqat.exe — the first thing seen on
          # opening it, and the only instructions a reader gets before the
          # SmartScreen warning or a missing runtime.
          Copy-Item ".github/windows-package/*" -Destination $out -Force

          Compress-Archive -Path "$out/*" -DestinationPath "$name.zip"
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: ${{ steps.zip.outputs.name }}.zip
          if-no-files-found: error

      - name: Remember the version
        shell: bash
        run: echo "${{ steps.zip.outputs.version }}" > version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: version-${{ matrix.arch }}
          path: version.txt

  # On Linux rather than the Windows runner: the release title and notes are
  # Arabic, and a Linux shell hands them to gh as they are.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      # Every zip the matrix produced, each in its own directory.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish to the website
        env:
          GH_TOKEN: ${{ secrets.SITE_RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::SITE_RELEASE_TOKEN is not set, so the site's release cannot be written. The zips are on this run's page."
            exit 1
          fi

          version="$(cat artifacts/version-*/version.txt | head -1)"
          if [ -z "$version" ]; then
            echo "::error::No build reported its version, so there is nothing to publish."
            exit 1
          fi

          # The x64 asset keeps the exact name the website's button asks for.
          # arm64 sits beside it; a machine that needs it is told so in the
          # notes, because the button can only point at one file.
          declare -A asset_for=(
            [x64]="iqra-wartaq-windows-x64.zip"
            [arm64]="iqra-wartaq-windows-arm64.zip"
          )

          assets=()
          digests=()
          for arch in x64 arm64; do
            zip="$(find artifacts -name "iqra-wartaq-windows-$arch-*.zip" | head -1)"
            if [ -z "$zip" ]; then
              echo "::warning::No $arch build to publish; it is missing from this release."
              continue
            fi
            cp "$zip" "${asset_for[$arch]}"
            assets+=("${asset_for[$arch]}")
            sha="$(sha256sum "${asset_for[$arch]}" | cut -d' ' -f1)"
            digests+=("${asset_for[$arch]} — SHA-256: $sha")
          done

          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::Neither architecture produced a zip."
            exit 1
          fi

          tag="windows-$version"
          # A published build is never replaced: someone may already have
          # downloaded it and checked its digest. Every push to main moves the
          # build number, so a new build always has a new tag.
          if gh release view "$tag" -R "$SITE_REPO" >/dev/null 2>&1; then
            echo "::error::$tag is already published on $SITE_REPO. Push a new build (the build number moves on every push to main) rather than replacing it."
            exit 1
          fi

          # The template holds one placeholder line; there is a digest per
          # architecture, so the line is dropped and the digests appended.
          # Appended rather than substituted because a multi-line value in a
          # sed replacement is a quoting trap, and the digests are the last
          # thing in the notes anyway.
          grep -v '{{SHA256}}' .github/windows-release-notes.md > notes.md
          printf '%s\n' "${digests[@]}" >> notes.md

          # 1.1.0-4 -> "1.1.0 (4)", as the first release was titled.
          label=$(echo "$version" | sed -E 's/-([0-9]+)$/ (\1)/')

          # --latest is what moves the website's button to this build.
          gh release create "$tag" "${assets[@]}" \
            -R "$SITE_REPO" \
            --title "اقرأ وارتق لـ Windows — $label" \
            --notes-file notes.md \
            --latest
          echo "Published https://github.com/$SITE_REPO/releases/tag/$tag"
