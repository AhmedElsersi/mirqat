name: Bump build number

# Auto-increments pubspec.yaml's +N on every push to main, so main always
# carries a versionCode higher than whatever was last uploaded to Play.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  # Two merges landing close together must not both read the same +N and
  # both try to write N+1 — serialize on main itself.
  group: bump-build-number-main
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Always, with no guard on what the push changed.
      #
      # There used to be one: a push that touched the `version:` line itself
      # was left alone, on the grounds that whoever wrote it had chosen the
      # number. That reasoning had the invariant backwards. The number in a
      # commit is the number release.yml *uploads*, so once that push has
      # landed the number is spent, and main must be moved past it or the next
      # merge offers both stores a build they have already seen — which is
      # exactly what happened to 1.1.0 build 25 and refused the merge after
      # it. Moving on always is the only state in which main is never holding
      # a spent number. A push that releases nothing (docs, a version-only
      # push) simply skips a build number, and build numbers are free.
      - name: Bump build number
        id: bump
        run: tool/bump_build_number.sh

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: build number ${{ steps.bump.outputs.previous }} -> ${{ steps.bump.outputs.version }}"
          # NOTE: a push authenticated with the default GITHUB_TOKEN does not
          # trigger other workflow runs (GitHub's loop-prevention rule) — so
          # this is safe from a bump-triggers-bump loop, but it also means
          # ci.yml does NOT re-run against this bump commit. That's accepted
          # here since the bump only touches versionCode, not app code.
          # If branch protection on main requires status checks or blocks
          # direct pushes, this job needs an exemption (e.g. via a PAT with
          # bypass rights, or excluding github-actions[bot] from the rule).
          git push
